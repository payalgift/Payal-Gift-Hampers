<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Payal Gift Hamper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h2 class="logo">Payal Gift Hamper</h2>

        <a href="index.html" class="shop-btn">
            Continue Shopping
        </a>
    </header>

    <!-- Checkout -->
    <main class="checkout-page">

        <h1>Checkout</h1>
        <p class="cart-subtitle">
            Complete your details to place your order.
        </p>

        <div class="checkout-layout">

            <!-- Customer Details Form -->
            <section class="checkout-form">

                <h2>Delivery Details</h2>

                <form id="checkout-form">

                    <label for="customer-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        placeholder="Enter your full name"
                        required
                    >

                    <label for="customer-phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="customer-phone"
                        placeholder="10-digit mobile number"
                        pattern="[6-9][0-9]{9}"
                        maxlength="10"
                        required
                    >

                    <label for="customer-address">
                        Full Delivery Address
                    </label>

                    <textarea
                        id="customer-address"
                        rows="4"
                        placeholder="House number, street, area, city"
                        required
                    ></textarea>

                    <label for="customer-pincode">
                        PIN Code
                    </label>

                    <input
                        type="text"
                        id="customer-pincode"
                        placeholder="6-digit PIN code"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        required
                    >

                    <label for="customer-state">
                        State
                    </label>

                    <input
                        type="text"
                        id="customer-state"
                        placeholder="Enter your state"
                        required
                    >

                    <button type="submit" class="checkout-btn">
    Place Order on WhatsApp
</button>

                </form>

            </section>

            <!-- Order Summary -->
            <aside class="order-summary">

                <h2>Your Order</h2>

                <div id="checkout-items"></div>

                <hr>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span id="checkout-delivery">₹0</span>
                </div>

                <hr>

                <div class="summary-row total-row">
                    <strong>Total</strong>
                    <strong id="checkout-total">₹0</strong>
                </div>

            </aside>

        </div>

    </main>

    <footer>
        <h2>Payal Gift Hamper</h2>
        <p>Beautiful gifts, beautiful memories.</p>
    </footer>

    <script src="checkout.js"></script>

</body>
</html>
